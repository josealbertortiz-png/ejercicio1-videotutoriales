<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Tipos de Inputs</h1>
    <form action="procesa.php">
    <fieldset>
        <legend>Datos personales</legend>
    <p>
        <label for="nom">Nombre</label>
        <input type="text" maxlength="6" 
        name="nombre"
        id="nom" placeholder="Escriba su nombre completo"
        required minlength="4">

    </p>
    <p>
        <label for="pob">Población</label>
        <input type="text" value="Alcazar de san Juan" name="pob"  autofocus readonly="pob">

    <p> <label for="nom">Contraseña</label>
        <input type="password" maxlength="6" minlength="4"
        password="contraseña"
        id="nom">
    </p>
    <p>
      <label for="hombre">  Hombre:</label>
        <input type="radio" value="H" checked id="Hombre"
        name="genero">
       <label for="Mujer"> Mujer: </label>
        <input type="radio" value="M" id="Mujer" name="genero"  >
    </p>
    <p>
        <label for="fumador">Fumador</label>
        <input type="checkbox" name="fuma" id="fumador">
    </p>
    </fieldset>
    <p>
        <input type="submit" value="Enviar">
        <input type="reset" value="Reiniciar Formulario" id="">
    </p>
    <p>
       <label for="prov" >Provincia</label>
        <select name="prov" id="prov" >
            <option value="cr">Ciudad Real</option>
            <option value="ab">Albacete</option>
            <option value="gu">Guadalajara</option>
            <option value="cu">Cuenca</option>
            <option value="to" selected>Toledo</option>
        </select>
        <p><label for="obs">observaciones</label>
        <textarea name="obs" cols="67" rows="6"
        
         id="obs">Escriba algo aquí...</textarea>
    </p>
    </p>
    <p>
        <label for="Color">Color</label>
        <input type="color" name="color"
        id="color">
    </p>
    <p>
        <label for="fecha -nac">Fecha de nacimiento</label>
        <input type="date" name="fecha -nac"
        id="fecha -nac">
    </p>
    <p>
        <label for="edad">Edad</label>
        <input type="number" name="edad"
        id="edad" min="0" max="99">
    </p>
    <p>
        <label for="email">Email</label>
        <input type="email" name="email"
        id="email"></p>
        <p>
        <label for="foto">Adjuntar foto</label>
        <input type="file" name="foto"
        id="foto"></p>
        <p>
        <input type="submit" value="Enviar">
        <input type="reset" value="Reiniciar Formulario" id="">
    </p>

<!--Botonoes de envío y reset-->


    </form>
    
        
</body>
    </html>
